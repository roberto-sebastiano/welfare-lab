name: Deploy prod

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod        # → approvazione richiesta + sub OIDC "environment:prod"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Installa dipendenze
        run: |
          npm install -g aws-cdk
          pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: cdk deploy
        run: cdk deploy WelfareLab-prod -c stage=prod --require-approval never